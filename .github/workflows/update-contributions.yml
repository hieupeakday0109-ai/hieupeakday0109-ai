name: Sync Obsidian Profile Telemetry & Assets

on:
  schedule:
    # Runs at 00:00 UTC daily
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'design/**'
      - 'requirements.txt'
      - 'README.md'
      - '.github/workflows/update-contributions.yml'

permissions:
  contents: write

jobs:
  build-and-verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Profile Telemetry, SVGs & Drift Highway
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/build_profile.py

      - name: Validate Generated Assets & README Integrity
        run: |
          python scripts/validate_repo.py

      - name: Commit & Push Updated Assets
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/
          if git diff --staged --quiet; then
            echo "No changes to profile assets."
          else
            git commit -m "chore(auto): sync obsidian telemetry & drift highway [skip ci]"
            git push
          fi
