<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 191 32" width="191" height="32" role="img" aria-label="STATUS: OPERATIONAL">
  <style>
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>
  <defs>
