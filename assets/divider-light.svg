<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 14" width="100%" height="14" role="img" aria-label="Divider">
  <defs>
    <linearGradient id="divLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0" />
      <stop offset="25%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.7" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="pulseBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="1" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect x="0" y="6" width="1000" height="1.5" fill="url(#divLine)" />
  <rect x="-140" y="5.5" width="140" height="2.5" rx="1.2" fill="url(#pulseBar)">
    <animate attributeName="x" values="-140;1000" dur="4.5s" repeatCount="indefinite" />
  </rect>
  <polygon points="500,3 504,7 500,11 496,7" fill="#0284c7" opacity="0.85" />
</svg>
