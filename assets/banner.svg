<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709" />
      <stop offset="50%" stop-color="#0f0f14" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2b36" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#070709" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="gridPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04" />
      <circle cx="24" cy="24" r="0.75" fill="#ffffff" fill-opacity="0.08" />
    </pattern>

    <!-- Silver Accent Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#71717a" stop-opacity="0" />
      <stop offset="30%" stop-color="#a1a1aa" />
      <stop offset="50%" stop-color="#f4f4f5" />
      <stop offset="70%" stop-color="#a1a1aa" />
      <stop offset="100%" stop-color="#71717a" stop-opacity="0" />
    </linearGradient>

    <!-- Text Shimmer -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.55; }
    }
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .glow-bg {
      animation: pulseGlow 6s ease-in-out infinite;
    }
  </style>

  <!-- Card Background with Border -->
  <rect x="2" y="2" width="996" height="236" rx="14" fill="url(#bgGrad)" stroke="#27272a" stroke-width="1.5" />
  <rect x="2" y="2" width="996" height="236" rx="14" fill="url(#centerGlow)" class="glow-bg" />
  <rect x="2" y="2" width="996" height="236" rx="14" fill="url(#gridPattern)" />

  <!-- Corner Brackets (High-Tech Stealth Aesthetics) -->
  <path d="M 18 32 L 18 18 L 32 18" fill="none" stroke="#52525b" stroke-width="1.5" />
  <path d="M 982 32 L 982 18 L 968 18" fill="none" stroke="#52525b" stroke-width="1.5" />
  <path d="M 18 208 L 18 222 L 32 222" fill="none" stroke="#52525b" stroke-width="1.5" />
  <path d="M 982 208 L 982 222 L 968 222" fill="none" stroke="#52525b" stroke-width="1.5" />

  <!-- Top Metadata Header Bar -->
  <g class="mono" font-size="11" fill="#71717a">
    <circle cx="36" cy="38" r="3.5" fill="#10b981" />
    <text x="48" y="42" letter-spacing="1.5" fill="#a1a1aa">STATUS: ONLINE // NODE_ID: HP-0109</text>
    <text x="500" y="42" text-anchor="middle" letter-spacing="2">AUTONOMOUS AGENT CORE</text>
    <text x="964" y="42" text-anchor="end" letter-spacing="1.5" fill="#a1a1aa">PROTOCOL: AGY-v4</text>
  </g>

  <!-- Divider Line Top -->
  <line x1="36" y1="56" x2="964" y2="56" stroke="#27272a" stroke-width="1" />

  <!-- Center Identity -->
  <text x="500" y="118" text-anchor="middle" class="sans" font-weight="900" font-size="44" letter-spacing="14" fill="url(#textGrad)">
    HIEUPEAK
  </text>

  <!-- Sleek Accent Line -->
  <line x1="280" y1="142" x2="720" y2="142" stroke="url(#silverGrad)" stroke-width="1.5" />
  <circle cx="500" cy="142" r="2.5" fill="#ffffff" />

  <!-- Subtitle / Tagline -->
  <text x="500" y="174" text-anchor="middle" class="mono" font-size="13" font-weight="500" letter-spacing="4" fill="#a1a1aa">
    SYSTEMS ARCHITECT • AGENTIC AI • APEX EXECUTION
  </text>

  <!-- Bottom Telemetry Bar -->
  <line x1="36" y1="198" x2="964" y2="198" stroke="#27272a" stroke-width="1" />

  <g class="mono" font-size="10.5" fill="#71717a">
    <text x="36" y="217" letter-spacing="1">FLOW: DETERMINISTIC</text>
    <text x="500" y="217" text-anchor="middle" letter-spacing="1.5" fill="#94a3b8">EST. 2026 // CODEBASE ARCHITECTURE</text>
    <text x="964" y="217" text-anchor="end" letter-spacing="1">LATENCY: 0.12ms</text>
  </g>
</svg>
